name: hackathon
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-viaroute-size 100 /data/north-east.osrm
    volumes:
      - ./data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000'",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: sqlite:////data/hackathon.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://hackathon.tyneside.software,https://hackathon.tyneside.software,http://tyneside.software,https://tyneside.software,http://127.0.0.1:5500,http://localhost:5500}
      OSRM_URL: ${OSRM_URL:-http://osrm:5000}
    volumes:
      - ./data:/data
    depends_on:
      osrm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

