name: hackathon
services:
  api:
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: sqlite:////data/hackathon.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hackathon.tyneside.software,http://127.0.0.1:5500,http://localhost:5500}
    volumes:
      - api-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 10s

volumes:
  api-data:
